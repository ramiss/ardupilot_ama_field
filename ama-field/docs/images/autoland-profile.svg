<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
  <title>AMA field mode: AUTOLAND height profile</title>
  <defs>
    <marker id="cGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
  </defs>
  <rect width="1000" height="480" fill="#ffffff"/>
  <rect x="0" y="400" width="1000" height="80" fill="#e6efdc"/>
  <line x1="0" y1="400" x2="1000" y2="400" stroke="#5f6368" stroke-width="2"/>

  <!-- phase bands -->
  <rect x="330" y="40" width="330" height="360" fill="#fef7e0"/>
  <text x="180" y="32" fill="#5f6368" font-size="13" text-anchor="middle">transit · downwind (level)</text>
  <text x="495" y="32" fill="#c25600" font-size="13" text-anchor="middle">base circle and final turn</text>
  <text x="760" y="32" fill="#c25600" font-size="13" text-anchor="middle">final</text>
  <text x="935" y="32" fill="#188038" font-size="13" text-anchor="middle">rollout</text>

  <!-- trees -->
  <g fill="#7cb342" stroke="#558b2f">
    <path d="M90,400 l22,-90 22,90 z"/><path d="M130,400 l26,-110 26,110 z"/><path d="M180,400 l20,-80 20,80 z"/>
    <path d="M220,400 l24,-100 24,100 z"/><path d="M270,400 l18,-70 18,70 z"/>
  </g>
  <text x="180" y="283" fill="#33691e" font-size="12" text-anchor="middle" font-weight="600">obstacles</text>

  <!-- reference lines -->
  <line x1="40" y1="250" x2="330" y2="250" stroke="#d93025" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="44" y="268" fill="#b3261e" font-size="13">AUTOLAND_WP_ALT — minimum circuit height</text>
  <line x1="40" y1="120" x2="660" y2="120" stroke="#1a73e8" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="44" y="112" fill="#0b57d0" font-size="13">0.25 × AUTOLAND_WP_DIST — circuit height cap</text>
  <line x1="330" y1="312" x2="660" y2="312" stroke="#c25600" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="340" y="330" fill="#c25600" font-size="12">AUTOLAND_FNL_HGT</text>

  <!-- main path -->
  <path d="M40,170 L330,170" fill="none" stroke="#5f6368" stroke-width="4"/>
  <path d="M330,170 C345,170 355,174 365,180 L545,302 C555,309 565,312 580,312 L660,312" fill="none" stroke="#e8710a" stroke-width="4.5"/>
  <path d="M660,312 L835,384" fill="none" stroke="#e8710a" stroke-width="4.5"/>
  <path d="M835,384 C852,391 864,396 878,398 C886,399 892,400 900,400" fill="none" stroke="#c5221f" stroke-width="5"/>
  <line x1="900" y1="400" x2="985" y2="400" stroke="#188038" stroke-width="5" marker-end="url(#cGreen)"/>

  <!-- annotations -->
  <text x="50" y="160" fill="#3c4043" font-size="13">held level at the height AUTOLAND was selected</text>
  <circle cx="330" cy="170" r="5" fill="#e8710a"/>
  <text x="338" y="140" fill="#c25600" font-size="13" font-weight="700">descent starts</text>
  <text x="338" y="156" fill="#c25600" font-size="12">AUTOLAND_DSC_ARC before lined up</text>
  <text x="470" y="215" fill="#c25600" font-size="13">one even sink rate</text>
  <text x="470" y="231" fill="#c25600" font-size="13">round the circle</text>
  <text x="545" y="330" fill="#c25600" font-size="12">level: last 60° of the turn</text>
  <text x="700" y="300" fill="#c25600" font-size="13">gentle final from the</text>
  <text x="700" y="316" fill="#c25600" font-size="13">circle exit to the aim</text>
  <text x="790" y="340" fill="#c5221f" font-size="13" font-weight="700">flare</text>
  <text x="836" y="340" fill="#c5221f" font-size="12">LAND_FLARE_SEC / _ALT,</text>
  <text x="790" y="356" fill="#c5221f" font-size="12">sink → TECS_LAND_SINK</text>

  <!-- roll start = touchdown -->
  <circle cx="900" cy="400" r="7" fill="#202124" stroke="#ffffff" stroke-width="2"/>
  <path d="M900,421 l-7,-12 h14 z" fill="#c5221f"/>
  <text x="900" y="437" fill="#202124" font-size="13" font-weight="600" text-anchor="middle">roll start ≈ touchdown</text>
  <text x="992" y="453" fill="#80868b" font-size="11" text-anchor="end">(aim AUTOLAND_TD_OFS short of it; each landing reports where it touched down)</text>
  <text x="992" y="472" fill="#188038" font-size="12" text-anchor="end">rollout: steering × AUTOLAND_RO_GAIN</text>
</svg>
