<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
  <title>AMA field mode: fence bounce-back</title>
  <defs>
    <pattern id="hatch3" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#fdecea"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#f3b4ae" stroke-width="4"/>
    </pattern>
    <marker id="dGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
    <marker id="dPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8430ce"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#f3f8ee"/>
  <rect x="0" y="372" width="1000" height="228" fill="url(#hatch3)"/>
  <line x1="0" y1="372" x2="1000" y2="372" stroke="#d93025" stroke-width="3" stroke-dasharray="14 8"/>
  <text x="16" y="394" fill="#b3261e" font-weight="700">FLIGHT LINE</text>

  <!-- fence -->
  <circle cx="420" cy="400" r="300" fill="none" stroke="#8430ce" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="140" y="190" fill="#8430ce" font-weight="600">fence</text>

  <!-- runway, pits, runway circle -->
  <rect x="250" y="330" width="340" height="40" rx="3" fill="#b9bdc3"/>
  <rect x="340" y="420" width="160" height="70" rx="6" fill="#e8eaed" stroke="#9aa0a6"/>
  <text x="420" y="460" fill="#3c4043" text-anchor="middle" font-size="13" font-weight="600">pits</text>
  <circle cx="330" cy="230" r="70" fill="#e8f0fe" fill-opacity="0.6" stroke="#1a73e8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="330" y="234" fill="#1a73e8" font-size="12" text-anchor="middle">runway circle</text>

  <!-- 1 flying out in FBWB -->
  <path d="M470,248 L702,297" fill="none" stroke="#188038" stroke-width="4"/>
  <!-- breach point (on the fence) -->
  <circle cx="702" cy="297" r="7" fill="#d93025"/>
  <!-- 2 guided turn back -->
  <path d="M702,297 C760,309 800,290 790,258 C780,226 740,228 700,236" fill="none" stroke="#8430ce" stroke-width="4"/>
  <!-- 3 back to previous mode -->
  <path d="M700,236 L455,214" fill="none" stroke="#188038" stroke-width="4" marker-end="url(#dGreen)"/>

  <text x="482" y="268" fill="#188038" font-size="12" transform="rotate(11.9 470 248)">flying in FBWB (or CRUISE / FBWA)</text>
  <text x="728" y="340" fill="#b3261e" font-weight="700">1  fence breached → GUIDED</text>
  <text x="806" y="250" fill="#8430ce" font-weight="700">2  turns back toward</text>
  <text x="806" y="268" fill="#8430ce" font-weight="700">the runway circle</text>
  <text x="806" y="286" fill="#8430ce" font-size="13">(~50–60 m past the fence)</text>
  <text x="610" y="176" fill="#188038" font-weight="700" text-anchor="end">3  heading back (within 20°)</text>
  <text x="610" y="194" fill="#188038" font-size="13" text-anchor="end">"Fence: turned back, FBWB resumed"</text>

  <rect x="610" y="440" width="370" height="120" rx="8" fill="#ffffff" stroke="#dadce0"/>
  <text x="626" y="468" fill="#3c4043" font-size="13" font-weight="700">Other modes</text>
  <text x="626" y="490" fill="#3c4043" font-size="13">In TAKEOFF, AUTOLAND or RTL the aircraft stays in</text>
  <text x="626" y="508" fill="#3c4043" font-size="13">GUIDED, circling the runway, until the pilot</text>
  <text x="626" y="526" fill="#3c4043" font-size="13">changes mode. A breach during AUTOLAND abandons</text>
  <text x="626" y="544" fill="#3c4043" font-size="13">the landing — keep the circuit inside the fence.</text>
</svg>
